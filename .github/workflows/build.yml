name: Build AlphaSix VST3

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build plugin
        run: cmake --build build --config Release --target AlphaSix_VST3 --parallel 4

      - name: Offline render test
        if: runner.os != 'Windows'
        run: cmake --build build --config Release --target AlphaSixTest --parallel 4 && ./build/AlphaSixTest_artefacts/Release/AlphaSixTest .

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: AlphaSix-${{ runner.os }}-VST3
          path: build/AlphaSix_artefacts/Release/VST3/AlphaSix.vst3
